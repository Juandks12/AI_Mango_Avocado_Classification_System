<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fruit Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">Fruit Defect Detector</h1>

      <div class="card p-4">
        <form action="/predict" method="post" enctype="multipart/form-data">
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Select model</label>
              <select class="form-select" name="model">
                {% for m in models %}
                <option value="{{ m }}">{{ model_display.get(m, m|capitalize) }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Select fruit</label>
              <select class="form-select" name="fruit">
                {% for f in fruits %}
                <option value="{{ f }}">{{ f|capitalize }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Upload image</label>
            <input class="form-control" type="file" name="image" accept="image/*" required>
          </div>

          <button type="submit" class="btn btn-primary">Run detection</button>
        </form>
      </div>

    </div>
  </body>
</html>
