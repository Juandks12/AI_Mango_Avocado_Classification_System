<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Result - Fruit Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <a href="/" class="btn btn-outline-secondary mb-3">← Back</a>

      <div class="row">
        <div class="col-md-6">
          <h5>Original</h5>
            <div class="border p-2 bg-white">
            <img src="{{ url_for('static', filename=original) }}" class="img-fluid">
          </div>
        </div>
        <div class="col-md-6">
          <h5>Detection {% if model_display %}(<small>{{ model_display }}</small>){% endif %}</h5>
            <div class="border p-2 bg-white">
            <img src="{{ url_for('static', filename=result) }}" class="img-fluid">
          </div>
        </div>
      </div>

      <hr>

      <h5>Metadata</h5>
      <pre class="bg-white p-3 border">{{ metadata | tojson(indent=2) }}</pre>
      <a class="btn btn-success" href="/download_csv?file={{ json_path }}">Download CSV</a>
    </div>
  </body>
</html>
